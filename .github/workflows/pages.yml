name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar pruebas
        run: npm test
      - name: Revisar sintaxis de módulos
        run: node --check app.js && node --check projects.js && node --check scripts/prepare-pages.js
      - name: Preparar solo los archivos públicos del sitio
        run: npm run build:pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
